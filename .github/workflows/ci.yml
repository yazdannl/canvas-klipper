name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Check shell syntax
        run: bash -n canvas-klipper.sh install.sh flash/canvas-flash firmware/build.sh tests/klipper/run_batch_test.sh
      - name: Compile Python sources
        run: python -m compileall -q canvas installer klipper/klippy/extras tests
      - name: Run tests
        run: pytest -q
