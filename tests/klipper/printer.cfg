# Klipper batch-mode config only. GPIO labels are linux-process placeholders;
# file-output mode records commands to /dev/null and never accesses hardware.
[include macros.cfg]

[mcu]
serial: /tmp/canvas-klipper-batch-test-only

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: gpio14
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: temperature_host
control: watermark
min_temp: 0
max_temp: 300

[filament_switch_sensor toolhead]
switch_pin: gpio16
pause_on_runout: False

[drv8833 T0]
motor_fwd: gpio0
motor_rwd: gpio1
motor_hall: gpio2
motor_hall_resolution: 0.5

[drv8833 T1]
motor_fwd: gpio3
motor_rwd: gpio4
motor_hall: gpio5
motor_hall_resolution: 0.5

[drv8833 T2]
motor_fwd: gpio6
motor_rwd: gpio7
motor_hall: gpio8
motor_hall_resolution: 0.5

[drv8833 T3]
motor_fwd: gpio9
motor_rwd: gpio10
motor_hall: gpio11
motor_hall_resolution: 0.5

[canvas]
toolhead_sensor: toolhead
separation_method: tip_forming
extruder_feed_length: 10
extruder_feed_speed: 10
extruder_retract_length: 10
extruder_retract_speed: 10
load_attempts: 1
lane_T0_motor: T0
lane_T0_present_pin: gpio17
lane_T0_prep_pin: gpio18
lane_T1_motor: T1
lane_T1_present_pin: gpio19
lane_T1_prep_pin: gpio20
lane_T2_motor: T2
lane_T2_present_pin: gpio21
lane_T2_prep_pin: gpio22
lane_T3_motor: T3
lane_T3_present_pin: gpio23
lane_T3_prep_pin: gpio24
hub_tangle_pin: gpio25
cutter_sensor_pin: gpio26
pause_on_error: True

[pause_resume]
