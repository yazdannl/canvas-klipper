# Test-safe macro aliases: file-output mode cannot emulate sensor transitions or motion.
[gcode_macro T0]
gcode:
  CANVAS_STATUS

[gcode_macro T1]
gcode:
  CANVAS_STATUS

[gcode_macro T2]
gcode:
  CANVAS_STATUS

[gcode_macro T3]
gcode:
  CANVAS_STATUS

[gcode_macro CANVAS_CUT]
gcode:
  CANVAS_CUT_INTERNAL METHOD=cutter

[gcode_macro CANVAS_CUTTER_ACTUATE]
gcode:
  { action_raise_error("batch-test cutter is not a real actuator") }
