# EXAMPLE: CC1 CANVAS toolhead-board sensor configuration.
#
# Everything in this file is on the printer's TOOLHEAD board (the CC1 CANVAS toolhead PCB,
# its own Klipper MCU that COSMOS names "hotend"). None of these pins is on the CANVAS
# mainboard MCU; there is no "canvas:"-prefixed equivalent. The pins only exist if you have
# the CC1 CANVAS toolhead board *and* Klipper firmware on it, and they only resolve if your
# toolhead MCU is named "hotend" in printer.cfg.
#
# This project does not copy this file during install and canvas.cfg does not include it.
# Copy it to your Klipper config directory and include it from printer.cfg yourself if you
# want the diagnostics below.
#
# Sources (none of it verified on hardware by this project):
#   S1 https://github.com/OpenCentauri/cosmos/blob/main/meta-opencentauri/recipes-data/klipper-afc-addon/files/centauri-carbon-1/canvas-toolhead.cfg
#   S2 https://github.com/OpenCentauri/cosmos/blob/main/meta-opencentauri/recipes-data/klipper-afc-addon/files/centauri-carbon-1/canvas.cfg
#   S3 https://github.com/OpenCentauri/OpenCentauri/blob/main/docs/hardware/CC1/CANVAS.md
# See docs/canvas-pins.md section 7 for the full table and confidence of each value.

# The toolhead filament switch is defined by canvas.cfg ([filament_switch_sensor toolhead],
# switch_pin !hotend:PB2 from S2). Uncomment only if you are not using canvas.cfg's section.
#[filament_switch_sensor toolhead]
#switch_pin: !hotend:PB2
#pause_on_runout: False

# Diagnostic only - this input is NOT wired into the [canvas] section. COSMOS names it
# "toolhead_tangle_detection" (S1); S3's connector table labels the same pad "S2 optical
# filament detect". Confirm the physical sensor and its polarity before relying on either
# reading, and keep config/canvas.cfg's hub_tangle_pin commented out until then.
[gcode_button toolhead_tangle_detection]
pin: !hotend:PB0
debounce_delay: 0.5
press_gcode:
    RESPOND TYPE=echo MSG="Toolhead filament sensor changed state (tangle/optical - unverified label)"

    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
release_gcode:
    RESPOND TYPE=echo MSG="Toolhead filament sensor cleared"

# Diagnostic only. Hall sensor for the magnet in the CC1 CANVAS toolhead cover (S1, S3).
[gcode_button toolhead_front_cover_detection]
pin: hotend:PC4
debounce_delay: 0.5
press_gcode:
    RESPOND TYPE=echo MSG="Toolhead cover sensor active"

    {% if printer.print_stats.state == "printing" %}
        PAUSE EMERGENCY=true
    {% endif %}
release_gcode:
    RESPOND TYPE=echo MSG="Toolhead cover sensor cleared"

