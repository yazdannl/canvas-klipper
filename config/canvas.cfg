# Elegoo CANVAS v1 control-layer example (CC1 CANVAS mainboard, MCU "canvas").
#
# Pin provenance: every value below is taken from the public COSMOS configuration for the
# CC1 CANVAS and/or the OpenCentauri hardware documentation. NONE of it is verified by this
# project on real hardware. Read docs/canvas-pins.md before using any of it: it lists the
# source URL and confidence for each value and every remaining unknown.
#
#   S1 COSMOS CC1 CANVAS Klipper config (the klipper-readonly/canvas.cfg that ships on the
#      printer): https://github.com/OpenCentauri/cosmos/blob/main/meta-opencentauri/recipes-data/klipper-afc-addon/files/centauri-carbon-1/canvas.cfg
#   S2 COSMOS CC1 CANVAS toolhead config:
#      https://github.com/OpenCentauri/cosmos/blob/main/meta-opencentauri/recipes-data/klipper-afc-addon/files/centauri-carbon-1/canvas-toolhead.cfg
#   S3 OpenCentauri CC1 CANVAS hardware docs (toolhead connector pin labels):
#      https://github.com/OpenCentauri/OpenCentauri/blob/main/docs/hardware/CC1/CANVAS.md
#
# Pins prefixed "canvas:" are on the CANVAS mainboard MCU. Pins prefixed "hotend:" are on the
# printer's TOOLHEAD board (a separate Klipper MCU that COSMOS names "hotend"); they exist
# only with the CC1 CANVAS toolhead board. Toolhead examples live in
# config/canvas_toolhead_example.cfg.
#
# No placeholder ships in this template: the only pins no public source documents are the
# optional lane_T*_present_pin switches, which ship unset (see below), so the installer can
# activate [include canvas/*.cfg]. It still defers the Klipper restart while any
# TO_BE_MEASURED remains in a generated config, including an uncommented optional pin.
[include canvas_macros.cfg]

[filament_switch_sensor toolhead]
# Toolhead-board Hall sensor that COSMOS uses as the toolhead/hub switch and as the
# extruder tool-start pin (S1: [AFC_hub toolhead_4way_hub] switch_pin and
# [AFC_extruder extruder] pin_tool_start; "!" = MCU pull-up). S3 labels the same pad
# "S5 tangle detection" - see docs/canvas-pins.md section 8, item 2.
# This is NOT a CANVAS MCU pin. Replace it with your printer's own toolhead switch if you
# do not have the CC1 CANVAS toolhead board, or if your toolhead MCU is not named "hotend".
switch_pin: !hotend:PB2
pause_on_runout: False

# The stock printer must also define its normal [extruder] and MCU sections, and the
# companion drv8833 extra plus matching MCU driver firmware must be installed first.

# Per-lane feed motor + rotation Hall. S1 for every pin and both non-pin values; T0..T3 map
# to COSMOS canvas_lane0..3 (AFC lanes CANVAS_1..4, tools T0..T3).
# NOTE: for lanes T1 and T3 the [board_pins] alias table in the same source file swaps
# FWD/RWD relative to the [drv8833] sections used here; if a lane runs backwards, swap
# motor_fwd/motor_rwd for that lane (docs/canvas-pins.md section 8, item 1).
[drv8833 T0]
motor_fwd: canvas:PA6
motor_rwd: canvas:PA5
motor_hall: canvas:PB6
motor_hall_resolution: 0.26242
motor_cycle_time: 0.0001

[drv8833 T1]
motor_fwd: canvas:PA7
motor_rwd: canvas:PB0
motor_hall: canvas:PB7
motor_hall_resolution: 0.26242
motor_cycle_time: 0.0001

[drv8833 T2]
motor_fwd: canvas:PB8
motor_rwd: canvas:PB9
motor_hall: canvas:PB5
motor_hall_resolution: 0.26242
motor_cycle_time: 0.0001

[drv8833 T3]
motor_fwd: canvas:PB1
motor_rwd: canvas:PB10
motor_hall: canvas:PB4
motor_hall_resolution: 0.26242
motor_cycle_time: 0.0001

[canvas]
toolhead_sensor: toolhead
separation_method: cutter           # cutter | tip_forming; CANVAS_UNLOAD METHOD=... overrides
cutter_macro: CANVAS_CUTTER_ACTUATE
# Cutter-actuation Hall on the TOOLHEAD board, not on the CANVAS MCU (S1:
# [AFC_canvas CANVAS_1] cutter_pin: !hotend:PC5; S3: connector pad "S4"). Active means the
# cutter is engaged / not yet returned to home. Delete this line without the CC1 CANVAS
# toolhead board or a differently named toolhead MCU.
cutter_sensor_pin: !hotend:PC5
# Shared hub/tangle sensor on the TOOLHEAD board (S2: [gcode_button
# toolhead_tangle_detection] pin: !hotend:PB0). Active blocks loading. S3 labels the same pad
# "S2 optical filament detect", so leave this commented out until you have confirmed which
# physical sensor it is and its polarity - a wrong value blocks every load.
# hub_tangle_pin: !hotend:PB0
cutter_retries: 3
cutter_timeout: 3.0
load_attempts: 3
extruder_feed_length: 40.0
extruder_feed_speed: 20.0
extruder_retract_length: 40.0
extruder_retract_speed: 20.0
grip_min_distance: 1.0
load_recovery_distance: 10.0
# Built-in tip-forming default: negative E distance in mm : speed in mm/s.
tip_forming_moves: -2:25;-4:15;-8:5
tip_forming_cool_ms: 300
# Optional custom macro hooks:
# park_macro: CANVAS_PARK
# post_cut_macro: CANVAS_POST_CUT
# tip_form_macro: CANVAS_CUSTOM_TIP_FORM
pause_on_error: True

# Lane wiring. lane_T*_motor names the [drv8833] section above; lane_T*_prep_pin is the
# per-lane filament switch S1 uses as the AFC `prep` pin (S1, and S4: one mechanical
# filament-detector switch per channel). Add "!" in front of a pin if that switch needs the
# MCU pull-up - confirm polarity on the bench first.
#
# OPTIONAL lane-present switches: no public source documents a second, spool-end switch per
# lane, so this template configures none. With lane_T*_present_pin unset, [canvas] derives
# that lane's presence from its prep switch: the lane is reported present only while the prep
# switch reads active, and the load's bounded move to the prep switch is what proves the lane
# holds filament. To use real switches later, uncomment and fill the block at the end of this
# file - a configured switch always takes precedence and then gates loading before any motion.
# See docs/canvas-pins.md section 3.
lane_T0_motor: T0
lane_T0_prep_pin: canvas:PA8
lane_T0_load_speed: 40.0
lane_T0_load_max_distance: 120.0
lane_T0_load_timeout: 30.0
lane_T0_prep_max_distance: 40.0
lane_T0_prep_timeout: 10.0
lane_T0_unload_speed: 40.0
lane_T0_unload_max_distance: 120.0
lane_T0_unload_timeout: 30.0
lane_T0_park_distance: 1.0
lane_T0_park_speed: 10.0
#
lane_T1_motor: T1
lane_T1_prep_pin: canvas:PC7
lane_T1_load_speed: 40.0
lane_T1_load_max_distance: 120.0
lane_T1_load_timeout: 30.0
lane_T1_prep_max_distance: 40.0
lane_T1_prep_timeout: 10.0
lane_T1_unload_speed: 40.0
lane_T1_unload_max_distance: 120.0
lane_T1_unload_timeout: 30.0
lane_T1_park_distance: 1.0
lane_T1_park_speed: 10.0
#
lane_T2_motor: T2
lane_T2_prep_pin: canvas:PC11
lane_T2_load_speed: 40.0
lane_T2_load_max_distance: 120.0
lane_T2_load_timeout: 30.0
lane_T2_prep_max_distance: 40.0
lane_T2_prep_timeout: 10.0
lane_T2_unload_speed: 40.0
lane_T2_unload_max_distance: 120.0
lane_T2_unload_timeout: 30.0
lane_T2_park_distance: 1.0
lane_T2_park_speed: 10.0
#
lane_T3_motor: T3
lane_T3_prep_pin: canvas:PC0
lane_T3_load_speed: 40.0
lane_T3_load_max_distance: 120.0
lane_T3_load_timeout: 30.0
lane_T3_prep_max_distance: 40.0
lane_T3_prep_timeout: 10.0
lane_T3_unload_speed: 40.0
lane_T3_unload_max_distance: 120.0
lane_T3_unload_timeout: 30.0
lane_T3_park_distance: 1.0
lane_T3_park_speed: 10.0
#
# Optional per-lane presence switches, uncommented one lane at a time. Do NOT point one at
# the prep pin of the same lane: a configured switch gates loading before any motion, and
# the prep switch is still clear then, so that combination refuses every load. Measure your
# own switch (or fit a spare filament-detector board) and replace the placeholder below with
# the measured pin. The placeholder is deliberately left as TO_BE_MEASURED so that, if it is
# uncommented unchanged, the installer refuses to activate [include canvas/*.cfg] instead of
# loading a config Klipper cannot parse.
#
# lane_T0_present_pin: TO_BE_MEASURED
# lane_T1_present_pin: TO_BE_MEASURED
# lane_T2_present_pin: TO_BE_MEASURED
# lane_T3_present_pin: TO_BE_MEASURED

# Reference only, left commented so it cannot affect Klipper: the CANVAS mainboard pin
# aliases COSMOS ships (S1). Uncomment if you want LEDs, odometers, the RFID reader or the
# motor-rail enables; none of them is used by this project's [canvas] section.
#
# [board_pins canvas]
# mcu: canvas
# aliases:
#     ENABLE_9V=PC2     , ENABLE_24V=PC3,
#     MOTOR0_FWD=PA6    , MOTOR0_RWD=PA5,
#     MOTOR1_FWD=PB0    , MOTOR1_RWD=PA7,
#     MOTOR2_FWD=PB8    , MOTOR2_RWD=PB9,
#     MOTOR3_FWD=PB10   , MOTOR3_RWD=PB1,
#     HALL0=PB6         , HALL1=PB7,
#     HALL2=PB5         , HALL3=PB4,
#     LED0_WHITE=PC9    , LED0_RED=PC8,
#     LED1_WHITE=PC6    , LED1_RED=PB15,
#     LED2_WHITE=PC10   , LED2_RED=PA15,
#     LED3_WHITE=PC1    , LED3_RED=PC12,
#     FILAMENT0=PA8     , FILAMENT1=PC7,
#     FILAMENT2=PC11    , FILAMENT3=PC0,
#     ODOMETER0=PA2     , ODOMETER1=PA3,
#     ODOMETER2=PA1     , ODOMETER3=PA0,
#     RFID_SCL=PD2      , RFID_SDA=PB3,
#     RFID_IRQ=PC14
#
# [pwm_cycle_time _buzzer_canvas]
# pin: canvas:PB13
