# Elegoo CANVAS v1 control-layer example.
# EVERY physical pin below is intentionally a comment marked TO_BE_MEASURED.
# Fill these from a verified revision-specific pin map before Klipper startup.
[include canvas_macros.cfg]

[filament_switch_sensor toolhead]
# Required; this toolhead sensor pin is not known generically.
# switch_pin: TO_BE_MEASURED
pause_on_runout: False

# The stock printer must also define its normal [extruder] and MCU sections.
# Add the companion drv8833 extra and matching MCU driver firmware first.
# The sample motor and sensor pins are intentionally not assigned.
#
# [drv8833 T0]
# motor_fwd: TO_BE_MEASURED
# motor_rwd: TO_BE_MEASURED
# motor_hall: TO_BE_MEASURED
# motor_hall_resolution: 0.5
#
# [drv8833 T1]
# motor_fwd: TO_BE_MEASURED
# motor_rwd: TO_BE_MEASURED
# motor_hall: TO_BE_MEASURED
# motor_hall_resolution: 0.5
#
# [drv8833 T2]
# motor_fwd: TO_BE_MEASURED
# motor_rwd: TO_BE_MEASURED
# motor_hall: TO_BE_MEASURED
# motor_hall_resolution: 0.5
#
# [drv8833 T3]
# motor_fwd: TO_BE_MEASURED
# motor_rwd: TO_BE_MEASURED
# motor_hall: TO_BE_MEASURED
# motor_hall_resolution: 0.5

[canvas]
toolhead_sensor: toolhead
separation_method: cutter           # cutter | tip_forming; CANVAS_UNLOAD METHOD=... overrides
cutter_macro: CANVAS_CUTTER_ACTUATE
# Optional; active means cutter engaged / not yet returned to home:
# cutter_sensor_pin: TO_BE_MEASURED
# Optional; active means shared hub/tangle detected:
# hub_tangle_pin: TO_BE_MEASURED
cutter_retries: 3
cutter_timeout: 3.0
load_attempts: 3
extruder_feed_length: 40.0
extruder_feed_speed: 20.0
extruder_retract_length: 40.0
extruder_retract_speed: 20.0
grip_min_distance: 1.0
load_recovery_distance: 10.0
# Built-in tip-forming default: negative E distance in mm : speed in mm/s.
tip_forming_moves: -2:25;-4:15;-8:5
tip_forming_cool_ms: 300
# Optional custom macro hooks:
# park_macro: CANVAS_PARK
# post_cut_macro: CANVAS_POST_CUT
# tip_form_macro: CANVAS_CUSTOM_TIP_FORM
pause_on_error: True

# T0 example. Duplicate this set with T1, T2, T3 suffixes and measured values.
# lane_T0_motor: T0
# lane_T0_present_pin: TO_BE_MEASURED
# lane_T0_prep_pin: TO_BE_MEASURED
# lane_T0_odometer_pin: TO_BE_MEASURED
# lane_T0_odometer_mm_per_pulse: 0.5
# lane_T0_load_speed: 40.0
# lane_T0_load_max_distance: 120.0
# lane_T0_load_timeout: 30.0
# lane_T0_prep_max_distance: 40.0
# lane_T0_prep_timeout: 10.0
# lane_T0_unload_speed: 40.0
# lane_T0_unload_max_distance: 120.0
# lane_T0_unload_timeout: 30.0
# lane_T0_park_distance: 1.0
# lane_T0_park_speed: 10.0
#
# Repeat lane_T0_* for T1/T2/T3. Klipper will report missing required lane
# keys until all four lanes have complete measured configuration.
