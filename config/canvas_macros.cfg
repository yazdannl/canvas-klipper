# Slicer-facing single-extruder tool aliases. Integrate manually if T0-T3 already exist.
[gcode_macro T0]
gcode:
  CANVAS_TOOL_SELECT TOOL=0

[gcode_macro T1]
gcode:
  CANVAS_TOOL_SELECT TOOL=1

[gcode_macro T2]
gcode:
  CANVAS_TOOL_SELECT TOOL=2

[gcode_macro T3]
gcode:
  CANVAS_TOOL_SELECT TOOL=3

# Public cutter command; the physical actuator hook below is printer-specific.
[gcode_macro CANVAS_CUT]
gcode:
  CANVAS_CUT_INTERNAL METHOD=cutter

# MUST be replaced with a verified physical cutter action before choosing cutter.
[gcode_macro CANVAS_CUTTER_ACTUATE]
gcode:
  { action_raise_error("Configure CANVAS_CUTTER_ACTUATE for the printer's physical cutter") }

